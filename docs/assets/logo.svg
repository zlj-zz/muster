<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="muster-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab459"/>
      <stop offset="100%" stop-color="#f5c2e7"/>
    </linearGradient>
    <filter id="glow-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Connection lines -->
  <line x1="20" y1="14" x2="20" y2="86" stroke="url(#muster-glow)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <line x1="80" y1="14" x2="80" y2="86" stroke="url(#muster-glow)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <line x1="20" y1="14" x2="50" y2="50" stroke="url(#muster-glow)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <line x1="80" y1="14" x2="50" y2="50" stroke="url(#muster-glow)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- Service nodes (corners) -->
  <circle cx="20" cy="14" r="8" fill="#1e1e2e" stroke="#eab459" stroke-width="3"/>
  <circle cx="80" cy="14" r="8" fill="#1e1e2e" stroke="#eab459" stroke-width="3"/>
  <circle cx="20" cy="86" r="8" fill="#1e1e2e" stroke="#eab459" stroke-width="3"/>
  <circle cx="80" cy="86" r="8" fill="#1e1e2e" stroke="#eab459" stroke-width="3"/>

  <!-- Center orchestrator node -->
  <circle cx="50" cy="50" r="11" fill="#eab459" filter="url(#glow-filter)"/>
  <circle cx="50" cy="50" r="6" fill="#1e1e2e"/>
</svg>