[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muster"
dynamic = ["version"]
description = "A TUI-based service orchestrator for local development"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual[syntax]>=8.2.8",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
muster = "muster.__main__:main"

[tool.hatch.version]
path = "src/muster/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/muster"]
include = ["src/muster/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
