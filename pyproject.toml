[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muster"
version = "0.1.0"
description = "A TUI-based service orchestrator for local development"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "textual-dev>=1.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
muster = "muster.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["muster"]
include = ["muster/*.tcss"]
